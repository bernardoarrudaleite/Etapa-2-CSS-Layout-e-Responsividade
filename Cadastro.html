<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="assets/css/style.css">  

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Cadastro</title>

</head>
<body>
    <section>
            <h2> Cadastre Seu Jogo </h2>

            <p>Tenha uma pagina de seu jogo em nosso site</p>
            
            <p>

            <label for="nome">Nome Do Jogo:</label>

            <input 
               type="text"
            
               id="nome"
               
               name="nome"

               required
            
             >
            
            </p>
       

          <p>
            <label for="classificacao">Classificação Indicativa</label>

            <input 
               type="number"
            
               id="classificacao"
               
               name="classificacao"
               
               required
             >

            </p> 


            <p>

            <label for="desenvolvedora">Desenvolvedora:</label>

            <input 
               type="text"
            
               id="desenvolvedora"
               
               name="desenvolvedora"
               
               required
               
             >
            
            </p> 

            <p>

            <label for="distribuidora">Distribuidora:</label>

            <input 
               type="text"
            
               id="distribuidora"
               
               name="distribuidora"
               
               required
               
             >

            </p>

            <p>

            <label for="sinopse">Sinopse:</label>
    
            <input 
               type="text"
            
               id="sinopse"
               
               name="sinopse"
               
               required
               
             >

            </p> 

            <p>

            <label for="genero">Genero:</label>

            <input 
               type="text"
            
               id="genero"
               
               name="genero"
               
               required
             >

               </p>

          <p>

            <label for="categoria">Categoria:</label>

            <input 
               type="text"
            
               id="categoria"
               
               name="categoria"
               
               required
             >

               </p>

          <p>

            <label for="lancamento">Lançamento:</label>

            <input 
               type="date"
            
               id="lancamento"
               
               name="lancamento"
               
               required
             >

            </p> 
    </section>

    <button type="submit"> <a href="index.html">

        Cadastrar

    </a></button>
    
</body>
</html>
